name: Release

# Runs when a version tag such as v0.1.0 is pushed. The job targets the
# "release" environment, which holds the signing secrets and requires the
# owner's approval before it starts (see docs/RELEASING.md). The result is a
# DRAFT GitHub release; nothing is published until the owner publishes it.
on:
  push:
    tags:
      - "v*"

permissions: {}

# Never cancel a release half way through; queue a second tag behind the first.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build, notarize and draft the release
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write # create the draft release and upload its assets
      id-token: write # let the attestation step obtain a Sigstore signing identity
      attestations: write # store the build provenance attestation
    env:
      TAG: ${{ github.ref_name }}
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Fail within seconds, not after a 20-minute build, when something is off.
      - name: Check the tag and the release secrets
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${TAG}' must look like v0.1.0 (vMAJOR.MINOR.PATCH)."
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag ${TAG} does not point at a commit on main. Merge first, then tag."
            exit 1
          fi

          missing=()
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD APPLE_TEAM_ID \
                      ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing secrets in the 'release' environment: ${missing[*]}"
            exit 1
          fi
          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID must be the 10-character Apple team identifier."
            exit 1
          fi

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Check that the tag matches MARKETING_VERSION
        run: |
          if ! settings="$(xcodebuild -project QuotaRing.xcodeproj -scheme QuotaRing \
            -configuration Release -showBuildSettings 2>&1)"; then
            printf '%s\n' "$settings"
            echo "::error::xcodebuild -showBuildSettings failed."
            exit 1
          fi
          marketing_version="$(awk '
            /^Build settings for action .* and target / { target = $NF; sub(/:$/, "", target) }
            target == "QuotaRing" && /^[[:space:]]*MARKETING_VERSION = / { print $3; exit }
          ' <<<"$settings")"
          if [[ -z "$marketing_version" ]]; then
            echo "::error::Could not read MARKETING_VERSION for the QuotaRing target."
            exit 1
          fi
          if [[ "$marketing_version" != "$VERSION" ]]; then
            echo "::error::Tag ${TAG} does not match MARKETING_VERSION ${marketing_version} in project.yml."
            exit 1
          fi
          echo "Releasing QuotaRing ${VERSION}."

      - name: Import the Developer ID certificate into a temporary keychain
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/release/import-cert.sh

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project QuotaRing.xcodeproj \
            -scheme QuotaRing \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/QuotaRing.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS=--timestamp

      - name: Export with Developer ID signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed "s/__APPLE_TEAM_ID__/${APPLE_TEAM_ID}/" scripts/release/ExportOptions.plist \
            > "${RUNNER_TEMP}/ExportOptions.plist"
          plutil -lint "${RUNNER_TEMP}/ExportOptions.plist" > /dev/null
          xcodebuild -exportArchive \
            -archivePath build/QuotaRing.xcarchive \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" \
            -exportPath build/export

      - name: Check the exported app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/release/package.sh check "$VERSION"

      - name: Notarize and staple the app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: scripts/release/notarize.sh build/export/QuotaRing.app

      - name: Build and sign the disk image
        run: scripts/release/package.sh dmg "$VERSION"

      # The signing key is no longer needed. Remove it before running anything
      # else, including on failure (runs even if an earlier step failed).
      - name: Remove the signing keychain
        if: ${{ always() && env.KEYCHAIN_PATH != '' }}
        run: scripts/release/import-cert.sh cleanup

      - name: Notarize and staple the disk image
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: scripts/release/notarize.sh "dist/QuotaRing-${VERSION}.dmg"

      - name: Zip the app and write checksums
        run: |
          scripts/release/package.sh zip "$VERSION"
          scripts/release/package.sh checksums "$VERSION"

      - name: Verify the release artifacts
        run: scripts/release/package.sh verify "$VERSION"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/QuotaRing-*.dmg
            dist/QuotaRing-*.zip

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="${RUNNER_TEMP}/release-notes.md"
          {
            section=""
            if [[ -f CHANGELOG.md ]]; then
              section="$(awk -v v="$VERSION" '
                /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
                found { print }
              ' CHANGELOG.md)"
            fi
            if [[ -n "${section//[[:space:]]/}" ]]; then
              printf '%s\n' "$section"
            else
              echo "See CHANGELOG.md for what changed in this release."
            fi
            echo
            echo "## Verify your download"
            echo
            echo "Signed with a Developer ID Application certificate, notarized by Apple and stapled."
            echo
            echo '```sh'
            echo 'shasum -a 256 -c SHA256SUMS'
            printf 'gh attestation verify QuotaRing-%s.dmg --repo %s\n' "$VERSION" "$GITHUB_REPOSITORY"
            echo '```'
          } > "$notes"

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "QuotaRing ${VERSION}" \
            --notes-file "$notes" \
            "dist/QuotaRing-${VERSION}.dmg" \
            "dist/QuotaRing-${VERSION}.zip" \
            dist/SHA256SUMS
