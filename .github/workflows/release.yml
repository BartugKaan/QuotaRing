name: Release

# Runs when a version tag such as v0.1.0 is pushed. The job targets the
# "release" environment, which holds the signing secrets and requires the
# owner's approval before it starts (see docs/RELEASING.md). The result is a
# DRAFT GitHub release; nothing is published until the owner publishes it.
on:
  push:
    tags:
      - "v*"

permissions: {}

# Never cancel a release half way through; queue a second tag behind the first.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build, notarize and draft the release
    runs-on: macos-15
    # Build (~30 min) plus two notarization rounds of up to NOTARY_TIMEOUT each,
    # with headroom. A first submission from a new developer account can be slow.
    timeout-minutes: 150
    environment: release
    permissions:
      contents: write # create the draft release and upload its assets
      id-token: write # let the attestation step obtain a Sigstore signing identity
      attestations: write # store the build provenance attestation
    env:
      TAG: ${{ github.ref_name }}
      # How long each notarization round may wait for Apple (e.g. 45m, 2h).
      # Override with a variable of the same name on the "release" environment.
      NOTARY_TIMEOUT: ${{ vars.NOTARY_TIMEOUT || '45m' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Fail within seconds, not after a 20-minute build, when something is off.
      - name: Check the tag, the repository and the release secrets
        env:
          GH_TOKEN: ${{ github.token }}
          # Only whether each secret is set ("true" or "false"), never its value:
          # this step does not need any secret. The format of APPLE_TEAM_ID is
          # checked by scripts/release/import-cert.sh, which needs the value.
          HAS_DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 != '' }}
          HAS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID != '' }}
          HAS_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID != '' }}
          HAS_ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 != '' }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${TAG}' must look like v0.1.0 (vMAJOR.MINOR.PATCH)."
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag ${TAG} does not point at a commit on main. Merge first, then tag."
            exit 1
          fi

          # Build provenance attestation is unavailable for private repositories
          # (docs/RELEASING.md), so the run could never finish. Fail closed if
          # the visibility cannot be read.
          if ! is_private="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)"; then
            echo "::error::Could not read the repository visibility from the GitHub API."
            exit 1
          fi
          if [[ "$is_private" == "true" ]]; then
            echo "::error::This repository is private. Build provenance attestation needs a public repository; make it public first (see docs/RELEASING.md)."
            exit 1
          fi

          # A release for this tag (published or draft) would make the final
          # step fail after 1-2 hours of build and notarization. `gh release
          # view` does not always find drafts, so also look through the list.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::A release for ${TAG} already exists; delete the draft or bump the version."
            exit 1
          fi
          if ! release_tags="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName')"; then
            echo "::error::Could not list the existing releases."
            exit 1
          fi
          if grep -qxF "$TAG" <<<"$release_tags"; then
            echo "::error::A release for ${TAG} already exists; delete the draft or bump the version."
            exit 1
          fi

          missing=()
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD APPLE_TEAM_ID \
                      ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            has="HAS_${name}"
            if [[ "${!has:-}" != "true" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing secrets in the 'release' environment: ${missing[*]}"
            exit 1
          fi

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      # A pinned release with a verified checksum, not whatever Homebrew has today.
      - name: Install XcodeGen
        run: scripts/ci/install-xcodegen.sh

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Check that the tag matches MARKETING_VERSION
        run: |
          if ! settings="$(xcodebuild -project QuotaRing.xcodeproj -scheme QuotaRing \
            -configuration Release -showBuildSettings 2>&1)"; then
            printf '%s\n' "$settings"
            echo "::error::xcodebuild -showBuildSettings failed."
            exit 1
          fi
          marketing_version="$(awk '
            /^Build settings for action .* and target / { target = $NF; sub(/:$/, "", target) }
            target == "QuotaRing" && /^[[:space:]]*MARKETING_VERSION = / { print $3; exit }
          ' <<<"$settings")"
          if [[ -z "$marketing_version" ]]; then
            echo "::error::Could not read MARKETING_VERSION for the QuotaRing target."
            exit 1
          fi
          if [[ "$marketing_version" != "$VERSION" ]]; then
            echo "::error::Tag ${TAG} does not match MARKETING_VERSION ${marketing_version} in project.yml."
            exit 1
          fi
          echo "Releasing QuotaRing ${VERSION}."

      - name: Import the Developer ID certificate into a temporary keychain
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/release/import-cert.sh

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project QuotaRing.xcodeproj \
            -scheme QuotaRing \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/QuotaRing.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS=--timestamp

      - name: Export with Developer ID signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed "s/__APPLE_TEAM_ID__/${APPLE_TEAM_ID}/" scripts/release/ExportOptions.plist \
            > "${RUNNER_TEMP}/ExportOptions.plist"
          plutil -lint "${RUNNER_TEMP}/ExportOptions.plist" > /dev/null
          xcodebuild -exportArchive \
            -archivePath build/QuotaRing.xcarchive \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" \
            -exportPath build/export

      - name: Check the exported app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/release/package.sh check "$VERSION"

      - name: Notarize and staple the app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: scripts/release/notarize.sh build/export/QuotaRing.app

      - name: Build and sign the disk image
        run: scripts/release/package.sh dmg "$VERSION"

      # The signing key is no longer needed. Remove it before running anything
      # else, including on failure (runs even if an earlier step failed).
      - name: Remove the signing keychain
        if: ${{ always() && env.KEYCHAIN_PATH != '' }}
        run: scripts/release/import-cert.sh cleanup

      - name: Notarize and staple the disk image
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: scripts/release/notarize.sh "dist/QuotaRing-${VERSION}.dmg"

      - name: Zip the app and write checksums
        run: |
          scripts/release/package.sh zip "$VERSION"
          scripts/release/package.sh checksums "$VERSION"

      - name: Verify the release artifacts
        run: scripts/release/package.sh verify "$VERSION"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/QuotaRing-*.dmg
            dist/QuotaRing-*.zip

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="${RUNNER_TEMP}/release-notes.md"
          {
            section=""
            if [[ -f CHANGELOG.md ]]; then
              section="$(awk -v v="$VERSION" '
                /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
                found { print }
              ' CHANGELOG.md)"
            fi
            if [[ -n "${section//[[:space:]]/}" ]]; then
              printf '%s\n' "$section"
            else
              echo "See CHANGELOG.md for what changed in this release."
            fi
            echo
            echo "## Verify your download"
            echo
            echo "Signed with a Developer ID Application certificate, notarized by Apple and stapled."
            echo
            echo '```sh'
            echo 'shasum -a 256 -c --ignore-missing SHA256SUMS'
            printf 'gh attestation verify QuotaRing-%s.dmg --repo %s \\\n  --signer-workflow %s/.github/workflows/release.yml\n' \
              "$VERSION" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY"
            echo 'codesign -dv --verbose=2 /Applications/QuotaRing.app 2>&1 | grep TeamIdentifier'
            echo '```'
            echo
            echo 'The TeamIdentifier must be the same for every QuotaRing release. The README explains each check under "Verify your download".'
          } > "$notes"

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "QuotaRing ${VERSION}" \
            --notes-file "$notes" \
            "dist/QuotaRing-${VERSION}.dmg" \
            "dist/QuotaRing-${VERSION}.zip" \
            dist/SHA256SUMS
