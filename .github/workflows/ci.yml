name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default; no job in this workflow needs more.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      - name: Run unit tests
        run: make test

  lint:
    name: Lint
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      - name: Check formatting
        run: make lint

  build:
    name: Build (unsigned)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project and build without signing
        run: make build XCODEBUILD_FLAGS="CODE_SIGNING_ALLOWED=NO"
