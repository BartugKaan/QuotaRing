name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default; no job in this workflow needs more.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      - name: Run unit tests
        run: make test

  lint:
    name: Lint
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      - name: Check formatting
        run: make lint

  build:
    name: Build (unsigned)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      # A pinned release with a verified checksum, not whatever Homebrew has today.
      - name: Install XcodeGen
        run: scripts/ci/install-xcodegen.sh

      - name: Generate the project and build without signing
        run: make build XCODEBUILD_FLAGS="CODE_SIGNING_ALLOWED=NO"

  # The README and CONTRIBUTING promise "Xcode 16.4 or later". The jobs above use
  # the newest Xcode on the runner, so this one checks the promised floor itself.
  # It fails (instead of quietly using another version) when the runner image no
  # longer has Xcode 16.4; raise the floor in the docs in that case. Lint is not
  # repeated here: swift-format output can differ between toolchains, and the
  # newest Xcode is the one that counts for formatting.
  xcode-floor:
    name: Xcode 16.4 (minimum supported)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exactly 16.4, not "16.4 or newer": the step fails if it is not installed.
      - name: Select Xcode 16.4
        env:
          XCODE_VERSION: "16.4"
        run: scripts/ci/select-xcode.sh

      - name: Install XcodeGen
        run: scripts/ci/install-xcodegen.sh

      - name: Run unit tests
        run: make test

      - name: Generate the project and build without signing
        run: make build XCODEBUILD_FLAGS="CODE_SIGNING_ALLOWED=NO"
