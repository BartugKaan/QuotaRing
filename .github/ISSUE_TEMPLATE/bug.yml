name: Bug report
description: Something in QuotaRing does not work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        **Do not paste tokens, credentials, or logs that may contain secrets.**
        QuotaRing never needs you to share a token. Please also do not paste the contents of
        `~/.claude.json`, `~/.claude/.credentials.json` or Keychain items; they can hold private
        data. If you are not sure whether something is sensitive, leave it out and describe it instead.

        Found a security problem? Do not open an issue. Follow the
        [security policy](https://github.com/BartugKaan/QuotaRing/security/policy).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you saw instead of the expected behavior.
      placeholder: The ring shows 100% but /usage in Claude Code says 40% used.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps are ideal. Say whether it happens every time.
      placeholder: |
        1. Launch QuotaRing
        2. Open the popover
        3. ...
    validations:
      required: false
  - type: input
    id: quotaring-version
    attributes:
      label: QuotaRing version
      description: Shown in Settings > About, or in the release you downloaded.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Apple menu > About This Mac. Include whether it is Apple silicon or Intel if you know.
      placeholder: "macOS 15.2, Apple silicon"
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How did you install QuotaRing?
      options:
        - Release DMG
        - Release zip
        - Built from source
        - Other
    validations:
      required: true
  - type: dropdown
    id: data-mode
    attributes:
      label: Data mode
      description: >-
        Default mode reads Claude Code's cached snapshot (nothing leaves your Mac).
        Live mode is the opt-in setting that also asks api.anthropic.com for your usage.
        You can check under Settings > Data.
      options:
        - Default (Claude Code cache, no Live mode)
        - Live mode enabled
        - Demo mode (--demo / make demo)
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: claude-usage
    attributes:
      label: How do you use Claude?
      description: This affects which data QuotaRing can see.
      multiple: true
      options:
        - Claude Code in the terminal
        - Claude desktop app
        - Claude Code in an IDE
        - claude.ai in the browser only
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: >-
        Screenshots are welcome (check that they show nothing private). If you include log output,
        read it first and remove anything sensitive.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find this problem.
          required: true
        - label: I have not pasted any token, credential, or log containing secrets.
          required: true
