version: 2

updates:
  # Keep the SHA-pinned actions in .github/workflows current. Dependabot
  # rewrites the full commit SHA and the trailing "# vX.Y.Z" comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Propose a release only once it is a week old, so a just-published
    # (possibly compromised) action version is not picked up at once.
    # (github-actions supports only default-days, not the semver-* keys.)
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
      include: scope
